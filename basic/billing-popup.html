<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearly.HUB Billing Component</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <script src="./components.js"></script>
  <script>
    // create a channel, in the popup to send messages,
    // in the main window to receive messages::
    const bc = new BroadcastChannel('clearly-hub-components');

    const urlParams = new URLSearchParams(window.location.search);
    const payload = urlParams.get('payload'); // request for the Clearly.Hub component
    const componentResult = readComponentResult(); // result from the Clearly.Hub component

    // if we have a payload, we're in the popup version of this page.
    // we need to forward to the components page:
    if (!!payload) {
      window.open(`${config.componentUrl}/${payload}`, '_self');
    }

    // if we have a result, we're in the popup returning from the component.
    // we need to send the result back to the main window, which checks it:
    else if (componentResult) {
      bc.postMessage(componentResult);
      window.close();
    }

    // else, we're in the main window. we're just going to listen for
    // messages from the popup:
    else {
      // we're not in the popup, but in the main window.
      // stand by to receive messages from the component::
      bc.onmessage = (event) => {
        checkComponentResult(event.data).then(showComponentResult);
      };
    }

    const selectSubscription = () => {
      if (!isConfigured()) return;
      // the request (and its state) is created in the main window,
      // so the main window can check the result later::
      const request = createComponentRequest('SELECT_SUBSCRIPTION');

      // open _this_ page in a popup window
      // and pass the request as a query parameter::
      window.open(
        `?payload=${encodeURIComponent(request)}`,
        'hub-components',
        'width=400,height=600',
      );
    };
  </script>
</head>

<body>
  <div class="box">
    <a href="index.html">Home</a>
    <br />
    <button onClick="selectSubscription()">Select subscription</button>
  </div>
</body>

</html>
