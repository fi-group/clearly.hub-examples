<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearly.HUB Billing Component</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <script src="./components.js"></script>
  <script>
    // if we have a result, we're returning from the component.
    // check the result and show it::
    const componentResult = readComponentResult();
    if (componentResult) {
      // cleanup::
      window.history.replaceState({}, document.title, window.location.pathname);

      checkComponentResult(componentResult).then(showComponentResult);
    }

    const selectSubscription = () => {
      if (!isConfigured()) return;
      const request = createComponentRequest('SELECT_SUBSCRIPTION');

      // redirect to the component::
      window.open(`${config.componentUrl}/${request}`, '_self');
    };
  </script>
</head>

<body>
  <div class="box">
    <a href="index.html">Home</a>
    <br />
    <button onClick="selectSubscription()">Select subscription</button>
  </div>
</body>

</html>
